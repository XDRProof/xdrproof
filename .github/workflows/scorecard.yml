# scorecard: an outside check, by OpenSSF Scorecard, of how this repository is protected (branch rules, pinned
# actions, token permissions, a security policy, ...). Results go to the code scanning tab and to the public
# Scorecard API. It does not gate pull requests.
name: scorecard
# Editing the ruleset on main does not trigger it; run it by hand (workflow_dispatch) to refresh the score then.
on:
  branch_protection_rule:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
permissions: read-all
jobs:
  analysis:
    name: scorecard
    # a Dependabot squash merge pushes with a read-only token, so the SARIF upload would fail; the weekly run publishes
    if: github.event_name != 'push' || github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the results to code scanning
      id-token: write # publish the results to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          fail_on_publish_error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('results.sarif') != ''
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always() && hashFiles('results.sarif') != ''
        with:
          sarif_file: results.sarif
