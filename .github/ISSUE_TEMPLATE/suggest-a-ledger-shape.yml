name: Suggest a ledger shape
description: A ledger shape that broke, or could break, code that reads Stellar ledgers. Valid shapes go into the corpus.
title: "Ledger shape: "
labels: ["ledger shape"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. XDRProof's corpus holds rare but valid ledgers, each with the values a correct reader must return. If a shape has bitten your SDK, indexer or wallet, or you suspect it could, describe it below. A shape stellar-core can produce becomes a corpus entry, credited to this issue. An invalid input (bytes no ledger can hold) becomes a test vector instead.

        If the shape lets anyone halt or crash an indexer, please don't post it here: report it privately as described in [SECURITY.md](https://github.com/XDRProof/xdrproof/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What your code did wrong with it, or what you are worried about.
      placeholder: "Our indexer stored a balance short when a fee-bump transaction's inner transaction failed…"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where it happens
      description: The SDK, indexer or tool, and its version.
      placeholder: "wallet-backend main, go-stellar-sdk v0.9.0"
  - type: input
    id: example
    attributes:
      label: A real example, if you have one
      description: A ledger sequence, a transaction hash, or a link to an issue that shows it.
      placeholder: "pubnet ledger 56085459, or https://github.com/…/issues/…"
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - pubnet
        - testnet
        - futurenet
        - a local or standalone network
        - not sure
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: The CAP or protocol version involved, how often it happens, what a correct reader should return.
