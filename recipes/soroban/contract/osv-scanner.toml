# Known advisories in this folder's lockfile, and why each is accepted (checked 28 Nov 2026 against OSV with the
# exact locked versions). Re-check when the lockfile changes.

[[IgnoredVulns]]
id = "GHSA-pm4j-7r4q-ccg8"
reason = "Test contract pinned on purpose. Its compiled Wasm is test data that this repository distributes: the generated ledgers depend on its exact bytes, and the contract.upload-wasm corpus entries carry them. It runs only inside a throwaway standalone stellar-core with test keys. The affected crates run on a build machine only when the contract is rebuilt from source."

