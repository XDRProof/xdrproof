# Build: `stellar contract build --locked --out-dir ../wasm` (stellar-cli 30.0.1). soroban-sdk 28 refuses a
# plain `cargo build`. A clean rebuild reproduces wasm/xdrproof_kit2.wasm byte for byte (sha256 43d2577d...).
[package]
name = "xdrproof-kit2"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "=28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
